name: dim-platform

services:
  dim-web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://dim-api:3001}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on:
      dim-api:
        condition: service_healthy
    networks:
      - dim-network

  dim-api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      APP_ENV: ${APP_ENV:-production}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: ${REDIS_URL:-redis://dim-redis:6379}
      PROJECT_ID: ${PROJECT_ID:-3a4d3421-7d76-421c-afe2-e981e12ef64b}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    depends_on:
      dim-redis:
        condition: service_healthy
    networks:
      - dim-network

  dim-worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://dim-redis:6379}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      N8N_URL: ${N8N_URL}
      N8N_SERVICE_TOKEN: ${N8N_SERVICE_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION}
      X_CLIENT_ID: ${X_CLIENT_ID}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET}
      X_REDIRECT_URI: ${X_REDIRECT_URI}
      PROVIDER_RATE_PER_SECOND: ${PROVIDER_RATE_PER_SECOND:-5}
      ACCOUNT_RATE_PER_MINUTE: ${ACCOUNT_RATE_PER_MINUTE:-10}
    depends_on:
      dim-redis:
        condition: service_healthy
    networks:
      - dim-network

  dim-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - dim-network

volumes:
  redis_data:

networks:
  dim-network:
    driver: bridge
